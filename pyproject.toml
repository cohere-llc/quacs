[project]
name = "quacs"
version = "0.1.0"
description = "QUACS: run chemistry/aerosol parameterizations written in Python inside Fortran/C++ 3D models"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Matt Dawson", email = "matt@cohere-llc.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "mypy",
    "ruff",
]

[build-system]
requires = [
    "uv_build>=0.9.26,<0.10.0"
]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["quacs"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
